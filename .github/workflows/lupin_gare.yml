name: Lupin Gare (ANAC)

on:
  # ANAC pubblica gli avvisi in un unico blocco alle 06:00 UTC: un avvio al giorno,
  # poco dopo, basta. Gli avvii programmati inviano davvero su Telegram e
  # notificano solo le gare con punteggio AI >= 7.
  schedule:
    - cron: '47 6 * * *'   # ogni giorno alle 06:47 UTC (08:47 ora legale italiana)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modalità test (nessun messaggio Telegram reale, memoria non salvata)'
        type: boolean
        default: true
      esplora:
        description: 'Stampa nei log la struttura grezza dei dati ANAC'
        type: boolean
        default: true
      soglia_score:
        description: 'Notifica solo gare con punteggio AI >= questo valore (0 = tutte)'
        type: string
        default: '7'
      sorgente:
        description: 'Da dove prendere le gare'
        type: choice
        options: [auto, anac, ted]
        default: auto
      riprova:
        description: 'Test: ignora memoria e segnalibro (solo con modalità test)'
        type: boolean
        default: false
      giorni_indietro:
        description: 'Quanti giorni di pubblicazioni scaricare'
        type: string
        default: '1'

permissions:
  contents: write

concurrency:
  group: lupin-memoria
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui Lupin Gare
        env:
          # Bot dedicato alle gare (@lupinanacBot) se c'è il suo token, altrimenti quello di Lupin Case
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_GARE || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_GARE: ${{ secrets.TELEGRAM_CHAT_ID_GARE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (github.event.inputs.dry_run == 'true' && '1' || '0') }}
          ESPLORA: ${{ github.event.inputs.esplora == 'true' && '1' || '0' }}
          RIPROVA: ${{ github.event.inputs.riprova == 'true' && github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SOGLIA_SCORE: ${{ github.event.inputs.soglia_score || '7' }}
          SORGENTE: ${{ github.event.inputs.sorgente || 'auto' }}
          GIORNI_INDIETRO: ${{ github.event.inputs.giorni_indietro || '1' }}
          MAX_CHIAMATE_AI: '60'
        run: python lupin_gare.py

      - name: Salva memoria
        run: |
          [ -f gare_memoria.json ] || exit 0
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gare_memoria.json
          git commit -m "chore: update memoria gare [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
