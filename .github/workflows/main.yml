name: Lupin Grand Tour

on:
  schedule:
    - cron: '0 */2 * * *'   # ogni 2 ore
  workflow_dispatch:        # avvio manuale
    inputs:
      dry_run:
        description: 'Modalità test (nessun messaggio Telegram reale)'
        type: boolean
        default: true
      soglia_score:
        description: 'Notifica solo annunci con punteggio AI >= questo valore (0 = tutti)'
        type: string
        default: '0'
      test_ai:
        description: 'Test AI: valuta N annunci già noti per città e stampa i punteggi nei log (0 = off)'
        type: string
        default: '0'
      num_pagine:
        description: 'Pagine da scorrere per città (ATTENZIONE: >1 rischia il blocco Cloudflare su Wikicasa)'
        type: string
        default: '1'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Esegui Lupin
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          SOGLIA_SCORE: ${{ github.event.inputs.soglia_score || '0' }}
          TEST_AI: ${{ github.event.inputs.test_ai || '0' }}
          NUM_PAGINE: ${{ github.event.inputs.num_pagine || '1' }}
          MAX_CHIAMATE_AI: '60'
        run: python lupin_headless.py

      - name: Salva memoria
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          touch annunci_memoria.json
          git add annunci_memoria.json
          git commit -m "chore: update memoria annunci [skip ci]" || exit 0
          git push origin main
