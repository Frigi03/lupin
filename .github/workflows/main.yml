name: Lupin Grand Tour
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write # IMPORTANTE: Permette a GitHub di salvare la memoria

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installazione dipendenze
        run: |
          pip install requests camoufox playwright
          playwright install chromium

      - name: Esecuzione Lupin
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python lupin_headless.py

      - name: Salva memoria annunci
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Crea il file se non esiste per evitare errori al primo avvio
          touch annunci_inviati.txt
          git add annunci_inviati.txt
          # Commit e Push con gestione errore 128 (se non ci sono modifiche)
          git commit -m "Update memoria [skip ci]" || exit 0
          git push origin main
