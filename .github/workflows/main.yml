name: Lupin Grand Tour

on:
  schedule:
    - cron: '0 */2 * * *'   # ogni 2 ore
  workflow_dispatch:        # avvio manuale
    inputs:
      dry_run:
        description: 'ModalitÃ  test (nessun messaggio Telegram reale)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Esegui Lupin
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python lupin_headless.py

      - name: Salva memoria
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          touch annunci_memoria.json
          git add annunci_memoria.json
          git commit -m "chore: update memoria annunci [skip ci]" || exit 0
          git push origin main
